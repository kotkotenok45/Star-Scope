<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarScope — Топ Open Source проектов</title>
    <style>
      :root {
        --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
        --border: #e2e8f0; --accent: #2563eb; --accent-h: #1d4ed8; --code: #f1f5f9;
        --chip: #eff6ff; --chip-text: #1d4ed8; --green: #16a34a; --green-bg: #dcfce7;
      }
      [data-theme="dark"] {
        --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
        --border: #334155; --accent: #3b82f6; --accent-h: #60a5fa; --code: #334155;
        --chip: #1e293b; --chip-text: #93c5fd; --green: #4ade80; --green-bg: #14532d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); transition: background .25s, color .25s; }
      a { color: var(--accent); }
      header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--border); }
      .bar { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .logo { font-size: 1.35rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
      .logo svg { width: 26px; height: 26px; fill: var(--text); }
      .spacer { flex: 1; }
      input, select, button { font: inherit; border-radius: 12px; padding: 8px 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; outline: none; }
      input { cursor: text; }
      input:focus { box-shadow: 0 0 0 2px var(--accent); }
      button:hover { border-color: var(--accent); }
      main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; position: relative; }
      .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); border-color: var(--accent); }
      .card-top { display: flex; gap: 14px; }
      .card img, .detail img { border-radius: 12px; border: 1px solid var(--border); background: var(--code); }
      .name { font-weight: 700; font-size: 1.1rem; padding-right: 96px; }
      .owner { font-size: .75rem; color: var(--muted); margin: 2px 0 6px; }
      .desc { font-size: .85rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: .75rem; color: var(--muted); align-items: center; }
      .meta span { display: flex; align-items: center; gap: 5px; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: #94a3b8; display: inline-block; }
      .star { width: 14px; height: 14px; fill: #fbbf24; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip { font-size: .7rem; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--chip-text); font-weight: 500; }
      .chip-rel { background: var(--green-bg); color: var(--green); font-weight: 600; }
      .gh-link { position: absolute; top: 14px; right: 14px; font-size: .72rem; font-weight: 600; padding: 5px 10px; border-radius: 10px; border: 1px solid var(--border); text-decoration: none; background: var(--card); z-index: 1; }
      .gh-link:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
      .tabs { display: flex; gap: 4px; }
      .tab { border: none; background: none; font-weight: 600; color: var(--muted); padding: 8px 14px; border-radius: 99px; }
      .tab.active { background: var(--accent); color: #fff; }
      .tab:hover { border: none; background: var(--code); color: var(--text); }
      .tab.active:hover { background: var(--accent-h); }
      .like-btn { border: 1px solid var(--border); background: none; font-size: .72rem; padding: 3px 10px; border-radius: 99px; color: var(--muted); }
      .like-btn.liked { background: #fee2e2; color: #ef4444; border-color: #fecaca; }
      [data-theme="dark"] .like-btn.liked { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
      .chip-rec { background: var(--green-bg); color: var(--green); font-weight: 600; }
      .rec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; font-size: .9rem; color: var(--muted); }
      .empty { text-align: center; padding: 60px 20px; color: var(--muted); line-height: 1.7; }
      .notice { padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: .85rem; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
      [data-theme="dark"] .notice { background: #451a03; color: #fcd34d; border-color: #92400e; }
      .skeleton { height: 170px; border-radius: 16px; background: var(--card); animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .5; } }
      .detail { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin: 0 auto; }
      .detail .head { display: flex; gap: 20px; flex-wrap: wrap; }
      .detail h1 { font-size: 1.8rem; font-weight: 800; word-break: break-word; }
      .back { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); background: none; border: none; margin-bottom: 20px; }
      .back:hover { color: var(--accent); }
      .btn-primary { background: var(--accent); color: #fff; border: none; font-weight: 600; }
      .btn-primary:hover { background: var(--accent-h); }
      .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
      .btn-green { background: var(--green); color: #fff; border: none; font-weight: 600; }
      .btn-green:hover { background: var(--green); filter: brightness(1.1); }
      .btn-ghost { background: none; }
      .btn-big { padding: 10px 22px; font-size: .95rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
      .rel-box { margin-top: 20px; padding: 16px 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); }
      .rel-box h3 { font-size: .95rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
      .rel-latest { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
      .rel-badge { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--green-bg); color: var(--green); }
      .rel-none { font-size: .8rem; color: var(--muted); }
      .assets a { font-size: .8rem; margin-right: 10px; text-decoration: none; }
      .assets a:hover { text-decoration: underline; }
      .readme-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
      #readme { font-size: .95rem; line-height: 1.7; overflow-wrap: break-word; }
      #readme h1 { font-size: 1.6rem; margin: 24px 0 10px; }
      #readme h2 { font-size: 1.35rem; margin: 22px 0 10px; }
      #readme h3, #readme h4, #readme h5, #readme h6 { margin: 18px 0 8px; }
      #readme p { margin: 10px 0; }
      #readme ul, #readme ol { margin: 10px 0 10px 24px; }
      #readme li { margin: 4px 0; }
      #readme pre { background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 12px; overflow-x: auto; font-size: .85rem; margin: 12px 0; }
      #readme code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #readme :not(pre) > code { background: var(--code); padding: 2px 6px; border-radius: 5px; font-size: .85em; }
      #readme img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
      #readme blockquote { border-left: 4px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 10px 0; }
      #readme hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
      #readme a { text-decoration: underline; text-underline-offset: 2px; }
      .author-link { cursor: pointer; border-bottom: 1px dashed var(--muted); }
      .author-link:hover { color: var(--accent); }
      #readme { border-radius: 14px; padding: 20px; transition: background .25s, color .25s; }
      #readme.theme-dark { background: #0b1220; color: #e2e8f0; }
      #readme.theme-dark a { color: #60a5fa; }
      #readme.theme-dark :not(pre) > code { background: #1e293b; color: #e2e8f0; }
      #readme.theme-dark blockquote { color: #94a3b8; border-color: #3b82f6; }
      #readme.theme-dark img { border: 1px solid #334155; background: #0b1220; }
      #readme.theme-light { background: #ffffff; color: #0f172a; }
      #readme.theme-light a { color: #2563eb; }
      #readme.theme-light :not(pre) > code { background: #f1f5f9; color: #0f172a; }
      #readme.theme-light blockquote { color: #475569; }
      #readme.theme-light img { border: 1px solid #e2e8f0; }
      .footer { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 28px; }
      .err { color: #ef4444; }
      #sentinel { text-align: center; padding: 24px; font-size: .85rem; color: var(--muted); }
      .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 640px) { .bar input { width: 100%; } .name { padding-right: 0; } .gh-link { position: static; margin-top: 10px; display: inline-block; } }
    </style>
  </head>
  <body data-theme="dark">
    <header>
      <div class="bar">
        <div class="logo">
          <svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 0a8 8 0 00-2.53 15.59c.4.07.55-.17.55-.38v-1.34c-2.23.49-2.7-1.07-2.7-1.07-.36-.94-.89-1.19-.89-1.19-.73-.5.05-.49.05-.49.81.06 1.24.83 1.24.83.72 1.24 1.9.88 2.36.67.07-.52.28-.88.51-1.08-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.27.83 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.19c0 .21.15.46.55.38A8 8 0 0016 8a8 8 0 00-8-8z"/></svg>
          StarScope
        </div>
        <nav class="tabs">
          <button class="tab active" id="tabTop">🔥 Топ</button>
          <button class="tab" id="tabForyou">✨ Для вас</button>
        </nav>
        <div class="spacer"></div>
        <input id="search" placeholder="Поиск проекта…" style="width:220px" />
        <select id="sort">
          <option value="stars">По звёздам</option>
          <option value="updated">По обновлению</option>
        </select>
        <button id="theme" title="Тема">☀️</button>
      </div>
    </header>
    <main id="app"></main>
    <div class="footer">
      Данные: GitHub REST API · Перевод: MyMemory API · README и аватары принадлежат авторам репозиториев.
      Это неофициальный проект, не связан с GitHub.
    </div>

    <script>
      const GH = "https://api.github.com";
      const PER_PAGE = 50;
      let repos = [], page = 1, hasMore = true, loading = false, current = null;
      let readme = null, translated = null, targetLang = "ru";
      let tab = "top";
      let likes = {};
      try { likes = JSON.parse(localStorage.getItem("starscope_likes") || "{}"); } catch (e) { likes = {}; }
      // Система приоритетов (интересов): вход на страницу +10, скачивание релиза +10, пролистал без лайка -5, лайк +100
      let interest = { langs: {}, topics: {}, owners: {} };
      try {
        const si = JSON.parse(localStorage.getItem("starscope_interest") || "null");
        if (si && si.langs) interest = si;
        if (!interest.__v && Object.keys(likes).length) { // переносим старые лайки в интересы
          Object.values(likes).forEach(function (r) { bumpRepo(r, 100); });
          interest.__v = 1; persistInterest();
        }
      } catch (e) {}
      let readmeTheme = "dark";
      try { readmeTheme = localStorage.getItem("starscope_readme_theme") || "dark"; } catch (e) { readmeTheme = "dark"; }
      const viewedThisSession = new Set(), penalizedThisSession = new Set();
      function persistInterest() { try { localStorage.setItem("starscope_interest", JSON.stringify(interest)); } catch (e) {} }
      function bump(kind, key, w) { if (!key) return; if (!interest[kind]) interest[kind] = {}; interest[kind][key] = Math.max(0, (interest[kind][key] || 0) + w); persistInterest(); }
      function bumpRepo(r, w) { if (!r) return; bump("langs", r.language, w); (r.topics || []).slice(0, 8).forEach(function (t) { bump("topics", t, w); }); if (r.owner) bump("owners", r.owner.login, w); }
      function interestTotal() { return Object.values(interest.langs || {}).concat(Object.values(interest.topics || {})).concat(Object.values(interest.owners || {})).reduce(function (a, b) { return a + b; }, 0); }
      function applyReadmeTheme() {
        const el = document.getElementById("readme"), btn = document.getElementById("rmTheme");
        if (el) { el.classList.remove("theme-dark", "theme-light"); el.classList.add("theme-" + readmeTheme); }
        if (btn) btn.textContent = readmeTheme === "dark" ? "🌙 Тёмный README" : "☀️ Светлый README";
      }
      function toggleReadmeTheme() {
        readmeTheme = readmeTheme === "dark" ? "light" : "dark";
        try { localStorage.setItem("starscope_readme_theme", readmeTheme); } catch (e) {}
        applyReadmeTheme();
      }
      const LANG_COLORS = { JavaScript:"#f1e05a", TypeScript:"#3178c6", Python:"#3572A5", Java:"#b07219", "C++":"#f34b7d", C:"#555555", "C#":"#178600", Go:"#00ADD8", Rust:"#dea584", Ruby:"#701516", PHP:"#4F5D95", Shell:"#89e051", HTML:"#e34c26", CSS:"#563d7c", Swift:"#F05138", Kotlin:"#A97BFF", Dart:"#00B4AB", Vue:"#41b883", Zig:"#ec915c", Lua:"#000080", Haskell:"#5e5086", Elixir:"#6e4a7e", Scala:"#c22d40", Jupyter:"#DA5B0B" };
      const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const fmt = n => n>=1e6 ? (n/1e6).toFixed(1).replace(".0","")+"M" : n>=1e3 ? (n/1e3).toFixed(1).replace(".0","")+"k" : String(n);
      const assetType = name => { const m = name.match(/\.([a-z0-9]+)$/i); return m ? m[1].toLowerCase() : "bin"; };

      function inline(t) {
        t = esc(t);
        t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
        t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" loading="lazy" />');
        t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        return t;
      }
      function mdToHtml(md) {
        const lines = String(md).replace(/\r\n/g,"\n").split("\n");
        let out = [], inCode = false, listType = null;
        const closeList = () => { if (listType) { out.push(listType==="ul"?"</ul>":"</ol>"); listType=null; } };
        const sizes = ["1.6rem","1.35rem","1.2rem","1.05rem","1rem",".95rem"];
        for (const line of lines) {
          if (/^```/.test(line.trim())) {
            if (inCode) { out.push("</code></pre>"); inCode=false; }
            else { closeList(); out.push("<pre><code>"); inCode=true; }
            continue;
          }
          if (inCode) { out.push(esc(line)+"\n"); continue; }
          const h = line.match(/^(#{1,6})\s+(.*)/);
          if (h) { closeList(); const lv=h[1].length; out.push('<h'+lv+' style="font-size:'+sizes[lv-1]+'">'+inline(h[2])+'</h'+lv+'>'); continue; }
          if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { closeList(); out.push("<hr>"); continue; }
          if (/^\s*>\s?/.test(line)) { closeList(); out.push('<blockquote>'+inline(line.replace(/^\s*>\s?/,""))+'</blockquote>'); continue; }
          const ul = line.match(/^\s*[-*+]\s+(.*)/), ol = line.match(/^\s*\d+\.\s+(.*)/);
          if (ul) { if (listType!=="ul"){closeList();out.push("<ul>");listType="ul";} out.push('<li>'+inline(ul[1])+'</li>'); continue; }
          if (ol) { if (listType!=="ol"){closeList();out.push("<ol>");listType="ol";} out.push('<li>'+inline(ol[1])+'</li>'); continue; }
          if (!line.trim()) { closeList(); continue; }
          closeList(); out.push('<p>'+inline(line)+'</p>');
        }
        if (inCode) out.push("</code></pre>");
        closeList();
        return out.join("\n");
      }

      // GitHub-стайл README: исходный HTML-код в README проходит через белый список тегов и атрибутов (защита от XSS)
      function sanitizeHTML(html) {
        if (typeof DOMParser === "undefined") return html;
        const OK_TAGS = new Set("a abbr b bdi bdo blockquote br caption center code del details div em figcaption figure font h1 h2 h3 h4 h5 h6 hr i img ins kbd li mark ol p picture pre q s samp small source span strike strong sub summary sup table tbody td tfoot th thead tr u ul video wbr".split(" "));
        const DROP_TAGS = new Set("script style link iframe object embed form input button select textarea noscript option base meta frame frameset".split(" "));
        const OK_ATTRS = new Set("align alt class colspan controls dir height id lang loading loop muted poster rel rowspan size span src srcset start style title valign width".split(" "));
        const URL_ATTRS = new Set(["src", "href", "srcset", "poster"]);
        function safeUrl(u) {
          u = String(u || "").trim();
          if (/^javascript:/i.test(u) || /^vbscript:/i.test(u) || /^data:(?!image\/)/i.test(u)) return null;
          if (u.startsWith("#") || u.startsWith("/") || u.startsWith("//") || /^https?:\/\//i.test(u) || /^mailto:/i.test(u) || /^data:image\//i.test(u)) return u;
          return null;
        }
        let doc;
        try { doc = new DOMParser().parseFromString('<div id="__root">' + html + "</div>", "text/html"); } catch (e) { return html; }
        const root = doc.getElementById("__root");
        if (!root) return html;
        const walk = node => {
          Array.from(node.children).forEach(el => {
            const tag = el.tagName.toLowerCase();
            if (DROP_TAGS.has(tag)) { el.remove(); return; }
            if (!OK_TAGS.has(tag)) { // незнакомый тег убираем, но сохраняем содержимое
              const parent = el.parentNode;
              while (el.firstChild) parent.insertBefore(el.firstChild, el);
              parent.removeChild(el);
              walk(node);
              return;
            }
            Array.from(el.attributes).forEach(attr => {
              const n = attr.name.toLowerCase();
              if (n.startsWith("on") || !OK_ATTRS.has(n)) el.removeAttribute(attr.name);
              else if (URL_ATTRS.has(n) && !safeUrl(el.getAttribute(attr.name))) el.removeAttribute(attr.name);
            });
            if ((el.getAttribute("style") || "").toLowerCase().includes("javascript:")) el.removeAttribute("style");
            if (tag === "a" && el.getAttribute("href")) { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noreferrer noopener"); }
            walk(el);
          });
        };
        walk(root);
        return root.innerHTML;
      }

      async function translateText(text) {
        if (!text || !text.trim()) return text;
        const parts = text.split(/\n{2,}/), result = [];
        for (const p of parts) {
          if (!p.trim()) { result.push(p); continue; }
          const sentences = p.match(/[^.!?]+[.!?]*\s*/g) || [p];
          let chunks = [], cur = "";
          for (const s of sentences) {
            if ((cur+s).length > 450 && cur) { chunks.push(cur); cur = s; } else cur += s;
          }
          if (cur) chunks.push(cur);
          const done = [];
          for (const c of chunks) {
            try {
              const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(c.slice(0,490)) + "&langpair=en|" + targetLang);
              const j = await r.json();
              done.push((j && j.responseData && j.responseData.translatedText) || c);
            } catch { done.push(c); }
          }
          result.push(done.join(""));
        }
        return result.join("\n\n");
      }

      // Releases: total count (Link header) + asset types from the latest 10 releases
      async function fetchReleases(fullName) {
        try {
          const r = await fetch(GH + "/repos/" + fullName + "/releases?per_page=10");
          if (!r.ok) throw 0;
          const latest = await r.json();
          if (!latest.length) return { has: false };
          let count = latest.length;
          const link = r.headers.get("Link") || "";
          const last = link.match(/[?&]page=(\d+)>;\s*rel="last"/);
          if (last) count = parseInt(last[1], 10);
          const types = {};
          latest.slice(0, 3).forEach(rel => (rel.assets || []).forEach(a => {
            const t = assetType(a.name); types[t] = (types[t] || 0) + 1;
          }));
          return { has: true, count: count, latest: latest[0], types: types };
        } catch { return null; }
      }

      function relChips(rel) {
        if (!rel) return "";
        if (rel.has === false) return '<span class="chip">📦 без Releases</span>';
        if (!rel) return "";
        const typesHtml = Object.keys(rel.types).sort().map(t => '<span class="chip chip-rel">📦 .' + esc(t) + (rel.types[t] > 1 ? " ×" + rel.types[t] : "") + '</span>').join("");
        return '<span class="chip chip-rel">🚀 Releases: ' + (rel.count > 10 ? rel.count + "+" : rel.count) + '</span>' + typesHtml;
      }

      function card(r) {
        return '<div class="card" data-repo="'+esc(r.full_name)+'">'+
          '<a class="gh-link" href="'+r.html_url+'" target="_blank" rel="noreferrer">GitHub ↗</a>'+
          '<div class="card-top">'+
          '<img src="'+r.owner.avatar_url+'" width="56" height="56" loading="lazy" alt="" />'+
          '<div style="min-width:0">'+
          '<div class="name">'+esc(r.name)+'</div>'+
          '<div class="owner"><span class="author-link" data-author="'+esc(r.owner.login)+'">👤 '+esc(r.owner.login)+'</span></div>'+
          '<p class="desc">'+esc(r.description || "Без описания")+'</p>'+
          '<div class="meta">'+
          (r.language ? '<span><i class="dot" style="background:'+(LANG_COLORS[r.language]||"#94a3b8")+'"></i>'+esc(r.language)+'</span>' : "")+
          '<span><svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>'+fmt(r.stargazers_count)+'</span>'+
          '<span>Updated: '+new Date(r.updated_at || Date.now()).toLocaleDateString("ru-RU")+'</span>'+
          '</div>'+
          '<div class="chips">'+(r.__relHtml || "")+(r.topics||[]).slice(0,4).map(t=>'<span class="chip">'+esc(t)+'</span>').join("")+'<button class="like-btn'+(likes[r.full_name]?" liked":"")+'" data-like="'+esc(r.full_name)+'">'+(likes[r.full_name]?"♥ В избранном":"♡ Нравится")+'</button></div>'+
          '</div></div></div>';
      }

      function renderList() {
        if (tab !== "top") return;
        const app = document.getElementById("app");
        const q = document.getElementById("search").value.toLowerCase();
        const mode = document.getElementById("sort").value;
        let list = repos.filter(r => !q || r.name.toLowerCase().includes(q) || r.full_name.toLowerCase().includes(q) || (r.description||"").toLowerCase().includes(q));
        list.sort((a,b) => mode==="stars" ? b.stargazers_count-a.stargazers_count : String(b.updated_at||"").localeCompare(String(a.updated_at||"")));
        if (!list.length && hasMore) {
          app.innerHTML = '<div class="grid">'+Array(9).fill('<div class="skeleton"></div>').join("")+'</div>';
          return;
        }
        app.innerHTML = (window.__notice ? '<div class="notice">'+window.__notice+'</div>' : "") +
          '<div class="grid">'+list.map(card).join("")+'</div>' +
          '<div id="sentinel">'+(hasMore ? '<span class="spinner"></span>Загрузка ещё проектов…' : (list.length ? "Показаны все найденные проекты · всего " + list.length : "Ничего не найдено 🤷"))+'</div>';
        wireCards(app);
        if (hasMore) {
          const sentinel = document.getElementById("sentinel");
          if (!window.__io) window.__io = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) loadMore();
          }, { rootMargin: "600px" });
          window.__io.observe(sentinel);
        }
      }

      async function loadMore() {
        if (loading || !hasMore) return;
        loading = true;
        try {
          const r = await fetch(GH+"/search/repositories?q=stars:>50000&sort=stars&order=desc&per_page="+PER_PAGE+"&page="+page);
          if (!r.ok) throw 0;
          const j = await r.json();
          const items = j.items || [];
          repos = repos.concat(items);
          hasMore = items.length === PER_PAGE && page < 20; // GitHub search caps at 1000 results
          page++;
        } catch {
          hasMore = false;
          if (!repos.length) window.__notice = "Не удалось загрузить данные с GitHub API (возможен лимит).";
        }
        loading = false;
        if (!current) renderList();
        if (repos.length && !window.__relDone) prefetchReleases();
      }

      // Show release types on cards progressively (first batch only)
      let relPrefetched = 0;
      async function prefetchReleases() {
        window.__relDone = true;
        for (const r of repos.slice(0, 24)) {
          if (document.hidden) break;
          const rel = await fetchReleases(r.full_name);
          if (rel) r.__relHtml = relChips(rel);
          relPrefetched++;
          if (!current && relPrefetched % 6 === 0) {
            const el = document.querySelector('.card[data-repo="'+CSS.escape(r.full_name)+'"]');
            if (el) { const chips = el.querySelector(".chips"); if (chips && r.__relHtml) chips.innerHTML = r.__relHtml + chips.innerHTML.replace(r.__relHtml, ""); }
          }
        }
        if (!current) renderList();
      }

      async function openRepo(fullName) {
        current = repos.find(r => r.full_name === fullName) || (window.__recsList || []).find(r => r.full_name === fullName);
        readme = null; translated = null;
        const r = current;
        if (!viewedThisSession.has(fullName)) { viewedThisSession.add(fullName); bumpRepo(r, 10); } // вход на страницу проекта: +10
        document.getElementById("app").innerHTML = '<div style="max-width:820px;margin:0 auto">'+
          '<button class="back" id="back">← Назад к списку</button>'+
          '<div class="detail"><div class="head">'+
          '<img src="'+r.owner.avatar_url+'" width="96" height="96" alt="" />'+
          '<div style="min-width:0;flex:1">'+
          '<h1>'+esc(r.name)+'</h1>'+
          '<a href="'+r.html_url+'" target="_blank" rel="noreferrer">'+esc(r.full_name)+' ↗</a>'+
          '<div style="margin-top:6px"><span class="author-link" id="authorBtn">👤 '+esc(r.owner.login)+'</span></div>'+
          '<p style="margin-top:10px;color:var(--muted)">'+esc(r.description || "Без описания")+'</p>'+
          '<div class="meta" style="margin-top:12px">'+
          (r.language ? '<span><i class="dot" style="background:'+(LANG_COLORS[r.language]||"#94a3b8")+'"></i>'+esc(r.language)+'</span>' : "")+
          '<span><svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>'+fmt(r.stargazers_count)+' звёзд</span>'+
          '<span>Forks: '+fmt(r.forks_count||0)+'</span>'+
          (r.license ? '<span>📄 '+esc(r.license.spdx_id || r.license.name)+'</span>' : "")+
          '</div>'+
          '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">'+
          '<a class="btn-green btn-big" href="'+r.html_url+'" target="_blank" rel="noreferrer">⬇ Перейти на проект</a>'+
          '<a class="btn-primary btn-big" href="'+r.html_url+'/releases" target="_blank" rel="noreferrer">🚀 Releases</a>'+
          '<a class="btn-ghost btn-big" href="'+r.html_url+'/issues" target="_blank" rel="noreferrer">🐛 Issues</a>'+
          '<button class="btn-ghost btn-big" id="likeBtn" style="'+(likes[r.full_name]?"color:#ef4444;border-color:#fecaca;":"")+'">'+(likes[r.full_name]?"♥ В избранном":"♡ Нравится")+'</button>'+
          '</div>'+
          '</div></div>'+
          '<div id="relbox" class="rel-box"><h3><span class="rel-badge">📦</span> Releases</h3><p class="rel-latest"><span class="spinner"></span>Проверка релизов…</p></div>'+
          '</div>'+
          '<div class="detail" style="margin-top:20px">'+
          '<div class="readme-head">'+
          '<h2 style="font-size:1.2rem;font-weight:700">README</h2>'+
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<button class="btn-ghost" id="rmTheme">🌙 Тёмный README</button>'+
          '<select id="lang"><option value="ru">Русский</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option></select>'+
          '<button class="btn-primary" id="tr">🌐 Перевести</button>'+
          '<button class="btn-ghost" id="orig" style="display:none">Оригинал</button>'+
          '</div></div>'+
          '<div id="readme">Загрузка README…</div>'+
          '</div>'+
          '<p class="footer">Источник: github.com/'+esc(r.full_name)+' · Данные принадлежат авторам репозитория</p>'+
          '</div>';
        document.getElementById("back").onclick = () => {
          if (!likes[fullName] && !penalizedThisSession.has(fullName)) { // пролистал без лайка: -5
            penalizedThisSession.add(fullName);
            bump("langs", r.language, -5); (r.topics || []).slice(0, 8).forEach(t => bump("topics", t, -5)); bump("owners", r.owner.login, -5);
          }
          current = null; if (tab === "top") renderList(); else renderForYou(true);
        };
        document.getElementById("lang").onchange = e => targetLang = e.target.value;
        document.getElementById("tr").onclick = doTranslate;
        document.getElementById("orig").onclick = () => { translated = null; renderReadme(); };
        const ab = document.getElementById("authorBtn");
        if (ab) ab.onclick = e => { e.stopPropagation(); renderAuthor(r.owner.login); };
        const tb = document.getElementById("rmTheme");
        if (tb) tb.onclick = toggleReadmeTheme;
        applyReadmeTheme();
        document.getElementById("likeBtn").onclick = () => {
          toggleLike(fullName);
          const b = document.getElementById("likeBtn");
          b.textContent = likes[fullName] ? "♥ В избранном" : "♡ Нравится";
          b.style.color = likes[fullName] ? "#ef4444" : "";
          b.style.borderColor = likes[fullName] ? "#fecaca" : "";
        };

        fetchReleases(fullName).then(rel => {
          const box = document.getElementById("relbox");
          if (!box) return;
          if (!rel) { box.innerHTML = '<h3><span class="rel-badge">📦</span> Releases</h3><p class="rel-none">Не удалось проверить (лимит GitHub API).</p>'; return; }
          if (!rel.has) { box.innerHTML = '<h3><span class="rel-badge">📦</span> Releases</h3><p class="rel-none">У проекта нет релизов.</p>'; return; }
          const typesHtml = Object.keys(rel.types).sort().map(t =>
            '<span class="chip chip-rel" style="margin-right:6px">.'+esc(t)+(rel.types[t]>1 ? " ×"+rel.types[t] : "")+'</span>').join("");
          const assets = (rel.latest.assets || []).slice(0, 8).map(a =>
            '<a class="asset-dl" href="'+a.browser_download_url+'" title="'+esc(a.name)+' ('+fmt(a.download_count || 0)+' скачиваний)">📦 '+esc(a.name.length > 34 ? a.name.slice(0,32)+"…" : a.name)+'</a>').join("");
          box.innerHTML = '<h3><span class="rel-badge">🚀 '+(rel.count > 10 ? "10+" : rel.count)+' релизов</span> Последний: '+esc(rel.latest.tag_name)+' ('+new Date(rel.latest.published_at).toLocaleDateString("ru-RU")+')</h3>'+
            '<p class="rel-latest">Типы файлов последних релизов: '+typesHtml+'</p>'+
            (assets ? '<div class="assets">'+assets+'</div>' : "")+
            '<p class="rel-latest" style="margin-top:8px"><a href="'+r.html_url+'/releases" target="_blank" rel="noreferrer">Все релизы ↗</a></p>';
            box.querySelectorAll(".asset-dl").forEach(a => a.onclick = e => { e.stopPropagation(); bumpRepo(current, 10); });
        });

        try {
          const rr = await fetch(GH+"/repos/"+fullName+"/readme", { headers: { Accept: "application/vnd.github.raw+json" } });
          if (!rr.ok) throw 0;
          readme = (await rr.text()).slice(0, 40000);
          renderReadme();
          document.getElementById("tr").disabled = false;
        } catch {
          document.getElementById("readme").innerHTML = '<p class="err">Не удалось загрузить README (лимит GitHub API или README отсутствует).</p>';
          document.getElementById("tr").disabled = !current.description;
        }
      }

      function renderReadme() {
        const el = document.getElementById("readme");
        const shown = translated !== null ? translated : readme;
        if (translated !== null) el.innerHTML = '<div style="white-space:pre-wrap">'+esc(shown)+'</div>';
        else el.innerHTML = shown ? sanitizeHTML(mdToHtml(shown)) : '<p style="color:var(--muted)">README не найден.</p>';
        document.getElementById("orig").style.display = translated !== null ? "" : "none";
        document.getElementById("tr").textContent = translated !== null ? "Перевести снова" : "🌐 Перевести";
        applyReadmeTheme();
      }

      async function doTranslate() {
        const btn = document.getElementById("tr");
        btn.disabled = true; btn.textContent = "Перевод…";
        try {
          translated = await translateText(readme || current.description || "");
        } finally {
          btn.disabled = false;
          renderReadme();
        }
      }

      function wireCards(root) {
        root.querySelectorAll(".card").forEach(c => {
          c.onclick = e => { if (!e.target.closest(".gh-link")) openRepo(c.dataset.repo); };
          const gh = c.querySelector(".gh-link");
          if (gh) gh.onclick = e => e.stopPropagation();
          c.querySelectorAll(".like-btn").forEach(b => b.onclick = e => { e.stopPropagation(); toggleLike(b.dataset.like); });
          c.querySelectorAll(".author-link").forEach(b => b.onclick = e => { e.stopPropagation(); renderAuthor(b.dataset.author); });
        });
        const rb = document.getElementById("refreshRecs");
        if (rb) rb.onclick = () => { window.__recs = null; renderForYou(false); };
      }

      function toggleLike(fullName) {
        if (likes[fullName]) {
          bumpRepo(likes[fullName], -100); // снятие лайка откатывает +100 приоритета
          delete likes[fullName];
        } else {
          const r = repos.concat(window.__recsList || []).find(x => x.full_name === fullName);
          if (r) {
            likes[fullName] = { full_name: r.full_name, name: r.name, description: r.description, stargazers_count: r.stargazers_count, language: r.language, topics: (r.topics || []).slice(0, 8), owner: { login: r.owner.login, avatar_url: r.owner.avatar_url }, html_url: r.html_url, forks_count: r.forks_count || 0, updated_at: r.updated_at };
            bumpRepo(r, 100); // лайк: +100 приоритета языку/темам/автору
          }
        }
        try { localStorage.setItem("starscope_likes", JSON.stringify(likes)); } catch (e) {}
        if (!current) { if (tab === "top") renderList(); else renderForYou(true); }
      }

      function setTab(t) {
        tab = t;
        document.getElementById("tabTop").classList.toggle("active", t === "top");
        document.getElementById("tabForyou").classList.toggle("active", t === "foryou");
        document.getElementById("search").style.display = t === "top" ? "" : "none";
        document.getElementById("sort").style.display = t === "top" ? "" : "none";
        if (!current) { if (t === "top") renderList(); else renderForYou(true); }
      }

      async function renderForYou(useCache) {
        const app = document.getElementById("app");
        const liked = Object.values(likes);
        if (!liked.length && interestTotal() <= 0) {
          app.innerHTML = '<div class="empty"><div style="font-size:3rem">✨</div><h2 style="font-weight:800;margin:12px 0">Здесь появятся рекомендации</h2><p>Откройте вкладку «🔥 Топ»: заходите на страницы проектов, лайкайте их —<br>StarScope соберёт ваш профиль интересов (языки, темы, авторы) и подберёт похожие репозитории.</p></div>';
          return;
        }
        const key = Object.keys(likes).sort().join("|") + "#" + interestTotal();
        if (useCache && window.__recs && window.__recs.key === key && Date.now() - window.__recs.time < 600000) {
          app.innerHTML = window.__recs.html;
          wireCards(app);
          return;
        }
        const head = '<div class="rec-head">✨ Рекомендации на основе ваших лайков и истории просмотров <button id="refreshRecs" class="btn-ghost">↻ Обновить</button></div>';
        app.innerHTML = head + '<div class="grid">' + Array(9).fill('<div class="skeleton"></div>').join("") + '</div>';
        const langs = interest.langs || {}, topicsAll = interest.topics || {}, owners = interest.owners || {};
        const topLangs = Object.entries(langs).sort((a,b) => b[1]-a[1]).slice(0, 2).map(x => x[0]);
        const topTopics = Object.entries(topicsAll).sort((a,b) => b[1]-a[1]).slice(0, 3).map(x => x[0]);
        const topOwners = Object.entries(owners).sort((a,b) => b[1]-a[1]).slice(0, 2).map(x => x[0]);
        const seen = {}, cands = [];
        const score = r => {
          let s = 0;
          s += (langs[r.language] || 0);
          (r.topics || []).forEach(t => { s += (topicsAll[t] || 0); });
          if (r.owner) s += 2 * (owners[r.owner.login] || 0);
          return s;
        };
        const add = r => {
          if (!r || !r.full_name || likes[r.full_name] || seen[r.full_name]) return;
          const sc = score(r);
          if (sc <= 0) return;
          seen[r.full_name] = 1;
          const parts = [];
          if (r.owner && owners[r.owner.login]) parts.push("автор " + r.owner.login);
          const t = (r.topics || []).find(x => topicsAll[x]);
          if (t) parts.push("тема " + t);
          if (langs[r.language]) parts.push("язык " + r.language);
          r.__relHtml = '<span class="chip chip-rec">✨ ' + esc(parts.slice(0, 2).join(", ")) + '</span>';
          r.__score = sc;
          cands.push(r);
        };
        const jobs = [];
        topTopics.slice(0, 2).forEach(t => jobs.push(
          fetch(GH + "/search/repositories?q=topic:" + encodeURIComponent(t) + "+stars:>1000&sort=stars&order=desc&per_page=25").then(r => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] }))
            .then(j => (j.items || []).forEach(add))
        ));
        topLangs.slice(0, 1).forEach(l => jobs.push(
          fetch(GH + "/search/repositories?q=language:" + encodeURIComponent(l) + "+stars:>10000&sort=stars&order=desc&per_page=30").then(r => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] }))
            .then(j => (j.items || []).forEach(add))
        ));
        topOwners.slice(0, 2).forEach(o => jobs.push(
          fetch(GH + "/users/" + encodeURIComponent(o) + "/repos?sort=stars&per_page=15").then(r => r.ok ? r.json() : []).catch(() => [])
            .then(items => (Array.isArray(items) ? items : []).forEach(add))
        ));
        await Promise.all(jobs);
        cands.sort((a, b) => (b.__score - a.__score) || (b.stargazers_count - a.stargazers_count));
        const list = cands.slice(0, 24);
        window.__recsList = list;
        const html = head + '<div class="grid">' + list.map(card).join("") + '</div>' +
          (list.length ? "" : '<div class="empty">Пока не нашлось похожих проектов — добавьте больше лайков.</div>');
        window.__recs = { html: html, time: Date.now(), key: key };
        if (tab === "foryou" && !current) { app.innerHTML = html; wireCards(app); }
      }

      async function renderAuthor(login) {
        const app = document.getElementById("app");
        app.innerHTML = '<div style="max-width:820px;margin:0 auto"><button class="back" id="backAuthor">← Назад</button>'+
          '<div class="detail" style="text-align:center">'+
          '<div class="skeleton" style="width:96px;height:96px;border-radius:50%;margin:0 auto 12px"></div>'+
          '<h2 style="font-weight:800">'+esc(login)+'</h2></div>'+
          '<h3 style="margin:20px 0 12px;font-weight:700">Проекты автора</h3>'+
          '<div class="grid">'+Array(6).fill('<div class="skeleton"></div>').join("")+'</div></div>';
        const goBack = () => { if (current) openRepo(current.full_name); else if (tab === "top") renderList(); else renderForYou(true); };
        document.getElementById("backAuthor").onclick = goBack;
        let user = null, items = [];
        try {
          const results = await Promise.all([
            fetch(GH + "/users/" + encodeURIComponent(login)).then(res => res.ok ? res.json() : null).catch(() => null),
            fetch(GH + "/users/" + encodeURIComponent(login) + "/repos?sort=stars&per_page=30").then(res => res.ok ? res.json() : []).catch(() => [])
          ]);
          user = results[0]; items = Array.isArray(results[1]) ? results[1] : [];
        } catch (e) {}
        const app2 = document.getElementById("app");
        if (!app2 || !app2.querySelector("#backAuthor")) return; // пользователь уже ушёл со страницы
        app2.innerHTML = '<div style="max-width:820px;margin:0 auto"><button class="back" id="backAuthor">← Назад</button>'+
          '<div class="detail"><div class="head">'+
          '<img src="'+((user && user.avatar_url) || ("https://github.com/"+login+".png?size=192"))+'" width="96" height="96" alt="" />'+
          '<div style="flex:1;min-width:0">'+
          '<h1>'+esc((user && user.name) || login)+'</h1>'+
          '<div class="owner" style="font-size:.9rem">@'+esc(login)+'</div>'+
          ((user && user.bio) ? '<p style="margin-top:8px;color:var(--muted)">'+esc(user.bio)+'</p>' : "")+
          '<div class="meta" style="margin-top:10px">'+
          (user && user.followers != null ? '<span>👥 '+fmt(user.followers)+' подписчиков</span>' : "")+
          '<span>📦 '+(items.length ? items.length + "+" : "?")+' репозиториев</span>'+
          (user && user.location ? '<span>📍 '+esc(user.location)+'</span>' : "")+
          (user && user.blog ? '<span><a href="'+esc(user.blog)+'" target="_blank" rel="noreferrer">🌐 Сайт</a></span>' : "")+
          '</div>'+
          '<div style="margin-top:14px"><a class="btn-ghost btn-big" href="https://github.com/'+esc(login)+'" target="_blank" rel="noreferrer">Профиль на GitHub ↗</a></div>'+
          '</div></div></div>'+
          '<h3 style="margin:20px 0 12px;font-weight:700">Проекты автора</h3>'+
          '<div class="grid">'+(items.length ? items.map(card).join("") : '<div class="empty">Не удалось загрузить проекты (лимит GitHub API).</div>')+'</div></div>';
        document.getElementById("backAuthor").onclick = goBack;
        wireCards(app2);
      }

      document.getElementById("search").addEventListener("input", () => { if (!current && tab === "top") renderList(); });
      document.getElementById("sort").addEventListener("change", () => { if (!current && tab === "top") renderList(); });
      document.getElementById("theme").onclick = e => {
        const dark = document.body.dataset.theme === "dark";
        document.body.dataset.theme = dark ? "light" : "dark";
        e.target.textContent = dark ? "🌙" : "☀️";
      };
      document.getElementById("tabTop").onclick = () => setTab("top");
      document.getElementById("tabForyou").onclick = () => setTab("foryou");
      loadMore();
    </script>
  </body>
</html>
